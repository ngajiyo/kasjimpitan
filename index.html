<!DOCTYPE html>
<html>
<head>
    <title>Tes Koneksi Final</title>
    <meta charset="UTF-8">
</head>
<body style="font-family: sans-serif; padding: 20px;">

    <h2>Status Koneksi: <span id="status">Menghubungkan...</span></h2>
    <div id="debug" style="color: red; font-size: 12px; margin-bottom: 10px;"></div>
    
    <table border="1" id="tabelData" style="width: 100%; border-collapse: collapse; display: none;">
        <thead id="head"></thead>
        <tbody id="body"></tbody>
    </table>

    <script>
        // GANTI URL INI DENGAN URL WEB APP TERBARU ANDA
        const URL = 'https://script.google.com/macros/s/AKfycbztFaASjMFuynqh4PnNGhHAMV5CDddVPjzoxM7jtxNv91jmldyBh-PCdzb1wVZ0z1dc/exec';

        async function tes() {
            const status = document.getElementById('status');
            const debug = document.getElementById('debug');
            
            try {
                const response = await fetch(URL, {
                    method: 'GET',
                    mode: 'cors',
                    redirect: 'follow'
                });

                if (!response.ok) throw new Error('HTTP Error: ' + response.status);

                const data = await response.json();
                
                status.innerText = "BERHASIL!";
                status.style.color = "green";
                console.log(data);
                
                tampilkanData(data);

            } catch (err) {
                status.innerText = "GAGAL!";
                status.style.color = "red";
                debug.innerText = "Error: " + err.message + " (Cek Console F12 untuk detail)";
                console.error(err);
            }
        }

        function tampilkanData(data) {
            if (data.length === 0) return;
            const tabel = document.getElementById('tabelData');
            tabel.style.display = "table";
            
            const head = document.getElementById('head');
            const body = document.getElementById('body');
            
            // Buat Header
            let cols = Object.keys(data[0]);
            head.innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
            
            // Buat Baris
            body.innerHTML = data.map(row => 
                `<tr>${cols.map(c => `<td>${row[c]}</td>`).join('')}</tr>`
            ).join('');
        }

        tes();
    </script>
</body>
</html>
