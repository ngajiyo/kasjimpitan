<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kas Masjid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="max-w-md mx-auto min-h-screen pb-20">
        <div class="p-4 bg-white sticky top-0 z-50 shadow-sm flex justify-between items-center">
            <h1 class="font-bold text-lg text-blue-700">E-Kas Masjid</h1>
            <select id="monthFilter" class="text-xs border-none bg-blue-50 font-bold p-2 rounded-lg" onchange="renderUI()"></select>
        </div>

        <div class="p-4">
            <div class="bg-gradient-to-br from-blue-600 to-blue-800 rounded-3xl p-6 text-white shadow-xl">
                <p class="text-[10px] opacity-70 font-bold tracking-widest">TOTAL SALDO KAS</p>
                <h2 id="totalSaldo" class="text-3xl font-bold mt-1 tracking-tight text-white">Rp 0</h2>
                <div class="grid grid-cols-2 gap-4 mt-6 pt-4 border-t border-white/20">
                    <div>
                        <p class="text-[10px] opacity-70 font-bold text-green-200">PEMASUKAN</p>
                        <p id="totalMasuk" class="font-bold text-sm">Rp 0</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] opacity-70 font-bold text-red-200">PENGELUARAN</p>
                        <p id="totalKeluar" class="font-bold text-sm">Rp 0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="px-4 mb-4">
            <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                <p class="text-[10px] font-bold text-slate-400 text-center mb-4 uppercase tracking-widest">Analisa Kategori</p>
                <div class="h-52"><canvas id="expenseChart"></canvas></div>
            </div>
        </div>

        <div class="px-4 space-y-3" id="transactionList">
            <p class="text-center text-slate-400 text-sm py-10">Menghubungkan ke database...</p>
        </div>
    </div>

    <script>
        // MASUKKAN URL ANDA DI SINI
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxzvhZmUVG-lIIukWKIoBI2VbyC0CG6Z7eeL23w3PEvuPL1PEBEt3oFk5T35P6ib0lz/exec';

        let rawData = [];
        let myChart = null;

        async function init() {
            try {
                // Menambahkan parameter random agar browser tidak mengambil cache lama
                const response = await fetch(WEB_APP_URL + '?v=' + Math.random());
                if (!response.ok) throw new Error('Network response was not ok');
                
                rawData = await response.json();
                
                if (rawData && rawData.length > 0) {
                    setupFilter();
                    renderUI();
                } else {
                    document.getElementById('transactionList').innerHTML = '<p class="text-center text-slate-400 py-10">Data tidak ditemukan di Sheets.</p>';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('transactionList').innerHTML = `
                    <div class="p-6 bg-red-50 rounded-2xl border border-red-100 text-center">
                        <p class="text-red-600 font-bold text-sm">Gagal Sinkronisasi!</p>
                        <p class="text-red-400 text-[10px] mt-2 leading-relaxed">
                            Penyebab: Browser memblokir koneksi (CORS) atau URL salah.<br>
                            Pastikan Web App di-Deploy sebagai 'Anyone'.
                        </p>
                        <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-600 text-white text-xs rounded-lg font-bold">Coba Lagi</button>
                    </div>`;
            }
        }

        function setupFilter() {
            const months = [...new Set(rawData.map(item => {
                const d = new Date(item.tanggal);
                return d.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
            }))];
            const filter = document.getElementById('monthFilter');
            filter.innerHTML = months.map(m => `<option value="${m}">${m}</option>`).join('');
        }

        function renderUI() {
            const filterVal = document.getElementById('monthFilter').value;
            const listEl = document.getElementById('transactionList');
            let saldo = 0, masuk = 0, keluar = 0;
            const catData = {};

            const filtered = rawData.filter(item => {
                const d = new Date(item.tanggal).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
                return d === filterVal;
            });

            listEl.innerHTML = '';
            filtered.forEach(item => {
                // Normalisasi nama kolom agar aman dari huruf besar/kecil
                const jenis = String(item.jenis || '').toLowerCase();
                const jumlah = parseInt(item.jumlah) || 0;
                const kategori = item.kategori || 'Lainnya';
                const deskripsi = item.deskripsi || '-';
                const isMasuk = jenis === 'pemasukan';

                if(isMasuk) { masuk += jumlah; saldo += jumlah; }
                else { 
                    keluar += jumlah; saldo -= jumlah; 
                    catData[kategori] = (catData[kategori] || 0) + jumlah;
                }

                listEl.insertAdjacentHTML('beforeend', `
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl ${isMasuk ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600'} flex items-center justify-center text-lg">
                                ${isMasuk ? '💰' : '💸'}
                            </div>
                            <div>
                                <p class="text-sm font-bold text-slate-800 leading-tight">${deskripsi}</p>
                                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">${kategori}</p>
                            </div>
                        </div>
                        <p class="text-sm font-black ${isMasuk ? 'text-green-600' : 'text-red-600'}">
                            ${isMasuk ? '+' : '-'} ${jumlah.toLocaleString('id-ID')}
                        </p>
                    </div>
                `);
            });

            document.getElementById('totalSaldo').innerText = "Rp " + saldo.toLocaleString('id-ID');
            document.getElementById('totalMasuk').innerText = "Rp " + masuk.toLocaleString('id-ID');
            document.getElementById('totalKeluar').innerText = "Rp " + keluar.toLocaleString('id-ID');
            
            updateChart(catData);
        }

        function updateChart(catData) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            if(myChart) myChart.destroy();
            if(Object.keys(catData).length === 0) return;

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catData),
                    datasets: [{
                        data: Object.values(catData),
                        backgroundColor: ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'],
                        borderWidth: 0
                    }]
                },
                options: { 
                    maintainAspectRatio: false, 
                    cutout: '75%',
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 9, weight: 'bold' } } } } 
                }
            });
        }

        init();
    </script>
</body>

</html>
