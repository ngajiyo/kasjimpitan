<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kas RT 13</title>
    <link rel="preconnect" href="https://pfichwnfffjzibusofao.supabase.co">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        [x-cloak] { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .sticky-summary { position: sticky; top: 0.75rem; z-index: 40; }
        .img-thumbnail { width: 100%; max-height: 200px; object-fit: cover; border-radius: 1.5rem; cursor: pointer; }
        /* Style untuk Foto Full Size */
        .fullscreen-img { fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-4; }
    </style>
</head>
<body x-data="dashboard()">

    <div class="max-w-md mx-auto p-4 pb-24">
        <header class="mb-5 flex justify-between items-end px-1">
            <div>
                <p class="text-[9px] text-slate-400 font-black uppercase tracking-[0.3em] mb-0.5">Laporan Keuangan KAS JIMPITAN</p>
                <h1 class="text-xl font-[900] text-slate-900 tracking-tight">DK. JASEM RT 13</h1>
            </div>
            <button @click="fetchData()" class="p-2.5 bg-white rounded-xl shadow-sm border border-slate-100 active:scale-90 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            </button>
        </header>

        <div class="sticky-summary">
            <div class="bg-blue-700 rounded-[2rem] p-5 shadow-xl text-white overflow-hidden relative border border-blue-600">
                <div class="absolute -right-4 -top-4 w-20 h-20 bg-white/10 rounded-full"></div>
                <div class="relative z-10 flex flex-col items-center">
                    <p class="text-[9px] opacity-70 uppercase font-black tracking-widest mb-1">Saldo Akhir</p>
                    <h2 class="text-2xl font-[900] tracking-tight mb-4" x-text="formatRupiah(totals.saldo)"></h2>
                    <div class="w-full grid grid-cols-2 border-t border-white/10 pt-3 mt-1">
                        <div class="text-center border-r border-white/10 px-2">
                            <p class="text-[8px] opacity-60 uppercase font-bold mb-0.5">Total Masuk</p>
                            <p class="text-sm font-bold text-green-300" x-text="formatRupiah(totals.masuk)"></p>
                        </div>
                        <div class="text-center px-2">
                            <p class="text-[8px] opacity-60 uppercase font-bold mb-0.5">Total Keluar</p>
                            <p class="text-sm font-bold text-red-300" x-text="formatRupiah(totals.keluar)"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-6 space-y-3">
            <div class="flex gap-2 items-center">
                <select x-model="combinedFilter" @change="applyCombinedFilter()" class="py-3.5 pl-4 pr-2 rounded-2xl bg-white border border-slate-200 text-[11px] font-black text-slate-700 outline-none appearance-none flex-1 shadow-sm">
                    <option value="semua">Tampilkan Semua Riwayat</option>
                    <option value="bulan">Laporan Bulan Ini</option>
                    <optgroup label="Arsip Bulanan">
                        <template x-for="opt in archiveOptions" :key="opt.id">
                            <option :value="opt.id" x-text="opt.label"></option>
                        </template>
                    </optgroup>
                </select>
                
                <div class="flex gap-1.5" x-show="activeFilter !== 'semua'" x-transition>
                    <button @click="exportToExcel()" class="bg-emerald-600 text-white p-3.5 rounded-2xl shadow-lg active:scale-90 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    </button>
                    <button @click="exportToPDF()" class="bg-rose-600 text-white p-3.5 rounded-2xl shadow-lg active:scale-90 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 15h6" /></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="mb-4 mt-4 px-1">
            <div class="relative group">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400 group-focus-within:text-blue-500 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </span>
                <input type="text" x-model="searchQuery" @input="applySearch()" placeholder="Cari transaksi..." class="w-full bg-white border border-slate-200 py-3.5 pl-11 pr-4 rounded-2xl text-sm font-bold text-slate-700 outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all shadow-sm">
            </div>
        </div>

        <div class="space-y-4">
            <template x-for="(item, index) in displayTransactions" :key="item.id">
                <div>
                    <template x-if="index === 0 || new Date(item.tanggal).getMonth() !== new Date(displayTransactions[index-1].tanggal).getMonth() || new Date(item.tanggal).getFullYear() !== new Date(displayTransactions[index-1].tanggal).getFullYear()">
                        <div class="pt-2 pb-2 px-1">
                            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]" x-text="monthNames[new Date(item.tanggal).getMonth()] + ' ' + new Date(item.tanggal).getFullYear()"></h3>
                        </div>
                    </template>

                    <div @click="openDetailModal(item)" class="bg-white p-4 rounded-3xl border border-slate-50 shadow-sm flex items-center gap-4 active:scale-[0.98] cursor-pointer mt-2">
                        <div class="w-12 h-12 bg-slate-50 rounded-2xl flex flex-col items-center justify-center border shrink-0 text-center">
                            <span class="text-sm font-[800]" x-text="new Date(item.tanggal).getDate()"></span>
                            <span class="text-[8px] uppercase font-black text-blue-600" x-text="monthNames[new Date(item.tanggal).getMonth()].substring(0,3)"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="text-sm font-bold text-slate-800 truncate" x-text="item.deskripsi"></h4>
                            <p class="text-[9px] text-slate-400 font-bold uppercase" x-text="item.kategori"></p>
                        </div>
                        <div class="text-right shrink-0">
                            <p :class="item.jenis === 'pemasukan' ? 'text-emerald-600' : 'text-rose-600'" class="text-sm font-[900]" x-text="(item.jenis === 'pemasukan' ? '+' : '-') + formatRupiah(item.jumlah).replace('Rp', '')"></p>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <div x-show="showDetailModal" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" x-cloak x-transition>
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] shadow-2xl p-6 text-center overflow-y-auto max-h-[90vh]" @click.away="showDetailModal = false">
            <template x-if="selectedItem.nota_url">
                <img :src="selectedItem.nota_url" @click="showFullImage = true" class="img-thumbnail border border-slate-100 shadow-sm mb-4">
            </template>
            <div :class="selectedItem.jenis === 'pemasukan' ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600'" class="inline-block p-4 rounded-full mb-3">
                <svg x-show="selectedItem.jenis === 'pemasukan'" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M7 11l5-5m0 0l5 5m-5-5v12" /></svg>
                <svg x-show="selectedItem.jenis === 'pengeluaran'" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M17 13l-5 5m0 0l-5-5m5 5V6" /></svg>
            </div>
            <h3 class="text-3xl font-[900] text-slate-900" x-text="formatRupiah(selectedItem.jumlah)"></h3>
            <p class="mt-4 text-sm text-slate-600 font-bold" x-text="selectedItem.deskripsi"></p>
            <div class="mt-6 flex flex-col gap-3">
                <div class="flex gap-2">
                    <button @click="showDetailModal = false" class="flex-1 py-4 text-xs font-black text-slate-400 bg-slate-50 rounded-2xl uppercase">Tutup</button>
                    <button @click="openEditFromDetail()" class="flex-1 py-4 text-xs font-black text-blue-600 bg-blue-50 border border-blue-100 rounded-2xl uppercase">Ubah Data</button>
                </div>
                <button @click="deleteData(selectedItem.id)" class="w-full py-3.5 text-[9px] font-black text-rose-500 bg-rose-50 rounded-2xl uppercase">Hapus Transaksi</button>
            </div>
        </div>
    </div>

    <div x-show="showFullImage" x-transition.opacity class="fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-4" x-cloak @click="showFullImage = false">
        <img :src="selectedItem.nota_url" class="max-w-full max-h-full object-contain rounded-lg">
        <div class="absolute top-6 right-6 text-white font-black text-xs uppercase tracking-widest">Sentuh untuk tutup</div>
    </div>

    <div x-show="showEditModal" class="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" x-cloak x-transition>
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl" @click.away="showEditModal = false">
            <h3 class="text-xl font-black text-center mb-6 text-slate-800">UBAH DATA</h3>
            <div class="space-y-4 text-left">
                <div><label class="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 block">Tanggal</label>
                <input type="date" x-model="editingData.tanggal" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold outline-none ring-1 ring-slate-100"></div>
                <div><label class="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 block">Deskripsi</label>
                <textarea x-model="editingData.deskripsi" rows="3" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold outline-none ring-1 ring-slate-100 resize-none"></textarea></div>
                <div><label class="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 block">Jumlah (Rp)</label>
                <input type="number" x-model="editingData.jumlah" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-black text-blue-600 outline-none ring-1 ring-slate-100 text-xl"></div>
                <div><label class="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 block">Bukti Baru</label>
                <input type="file" @change="uploadImage($event)" class="text-[10px] font-bold"><p x-show="isUploading" class="text-blue-500 text-[10px] animate-pulse font-black mt-1 uppercase">Mengunggah...</p></div>
            </div>
            <div class="flex gap-3 mt-8">
                <button @click="showEditModal = false" class="flex-1 py-4 font-black text-xs text-slate-400 uppercase">Batal</button>
                <button @click="updateData()" :disabled="isUploading" class="flex-1 py-4 bg-slate-900 text-white rounded-2xl font-black text-xs uppercase shadow-lg">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pfichwnfffjzibusofao.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmaWNod25mZmZqemlidXNvZmFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MzE0NjIsImV4cCI6MjA4MTQwNzQ2Mn0.Hp9nGeQEiNXnKoPkeSY2Qoey0HP2Er0E4TbwBe_y64c';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function dashboard() {
            return {
                allData: [], filteredTransactions: [], displayTransactions: [], searchQuery: '', 
                archiveOptions: [], activeFilter: 'semua', combinedFilter: 'semua', 
                totals: { saldo: 0, masuk: 0, keluar: 0 }, 
                showDetailModal: false, showEditModal: false, isUploading: false,
                showFullImage: false, // State baru untuk foto full
                selectedItem: {}, editingData: {},
                monthNames: ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"],

                async init() { await this.fetchData(); },
                async fetchData() {
                    const { data } = await _supabase.from('kas_rt').select('*').order('tanggal', { ascending: false });
                    this.allData = data || [];
                    this.generateArchiveOptions();
                    this.applyCombinedFilter(); 
                },
                generateArchiveOptions() {
                    const groups = new Set();
                    this.allData.forEach(i => { const d = new Date(i.tanggal); groups.add(`${d.getMonth()}-${d.getFullYear()}`); });
                    this.archiveOptions = Array.from(groups).map(g => {
                        const [m, y] = g.split('-');
                        return { id: g, label: `${this.monthNames[m]} ${y}`, month: m, year: y };
                    }).sort((a,b) => b.year - a.year || b.month - a.month);
                },
                applyCombinedFilter() {
                    if (this.combinedFilter === 'semua') {
                        this.activeFilter = 'semua';
                        this.filteredTransactions = [...this.allData];
                    } else if (this.combinedFilter === 'bulan') {
                        this.activeFilter = 'bulan';
                        const now = new Date();
                        this.filteredTransactions = this.allData.filter(i => { 
                            const d = new Date(i.tanggal); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); 
                        });
                    } else {
                        this.activeFilter = 'archive';
                        const [m, y] = this.combinedFilter.split('-');
                        this.filteredTransactions = this.allData.filter(i => { 
                            const d = new Date(i.tanggal); return d.getMonth() == m && d.getFullYear() == y; 
                        });
                    }
                    this.calculate(); 
                    this.applySearch();
                },
                applySearch() {
                    const q = this.searchQuery.toLowerCase();
                    this.displayTransactions = this.filteredTransactions.filter(i => 
                        i.deskripsi.toLowerCase().includes(q) || i.kategori.toLowerCase().includes(q)
                    );
                },
                calculate() {
                    const m = this.filteredTransactions.filter(t => t.jenis === 'pemasukan').reduce((a, b) => a + Number(b.jumlah), 0);
                    const k = this.filteredTransactions.filter(t => t.jenis === 'pengeluaran').reduce((a, b) => a + Number(b.jumlah), 0);
                    this.totals = { masuk: m, keluar: k, saldo: m - k };
                },
                openDetailModal(item) { this.selectedItem = item; this.showDetailModal = true; },
                openEditFromDetail() { this.editingData = { ...this.selectedItem }; this.showDetailModal = false; setTimeout(() => { this.showEditModal = true; }, 300); },

                async uploadImage(event) {
                    const file = event.target.files[0]; if (!file) return;
                    this.isUploading = true;
                    const fileName = `${Date.now()}.${file.name.split('.').pop()}`;
                    const { data, error } = await _supabase.storage.from('upload').upload(`img/${fileName}`, file);
                    if (!error) {
                        const { data: { publicUrl } } = _supabase.storage.from('upload').getPublicUrl(`img/${fileName}`);
                        this.editingData.nota_url = publicUrl;
                    }
                    this.isUploading = false;
                },
                async updateData() {
                    const { error } = await _supabase.from('kas_rt').update({ 
                        tanggal: this.editingData.tanggal, deskripsi: this.editingData.deskripsi, 
                        jumlah: this.editingData.jumlah, nota_url: this.editingData.nota_url 
                    }).eq('id', this.editingData.id);
                    if (!error) { this.showEditModal = false; await this.fetchData(); }
                },
                async deleteData(id) {
                    if (confirm('Hapus transaksi?')) {
                        const { error } = await _supabase.from('kas_rt').delete().eq('id', id);
                        if (!error) { this.showDetailModal = false; await this.fetchData(); }
                    }
                },

                getPeriodeLabel() {
                    if (this.combinedFilter === 'semua') return "Semua Riwayat";
                    if (this.combinedFilter === 'bulan') return this.formatMonthYear(new Date());
                    const opt = this.archiveOptions.find(o => o.id === this.combinedFilter);
                    return opt ? opt.label : "Laporan Bulanan";
                },

                exportToPDF() {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    const labelPeriode = this.getPeriodeLabel();

                    doc.setFontSize(14); doc.text("LAPORAN KEUANGAN KAS RT 13", 14, 15);
                    doc.setFontSize(10); doc.text("Periode: " + labelPeriode, 14, 22);
                    
                    const sortedData = [...this.displayTransactions].sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

                    const tableData = sortedData.map(i => [
                        new Date(i.tanggal).toLocaleDateString('id-ID'), 
                        i.deskripsi, 
                        i.kategori, 
                        i.jenis.toUpperCase(), 
                        this.formatRupiah(i.jumlah)
                    ]);

                    doc.autoTable({
                        startY: 30, 
                        head: [['Tanggal', 'Keterangan', 'Kategori', 'Jenis', 'Jumlah']], 
                        body: tableData,
                        foot: [
                            ['', '', '', 'Total Masuk', this.formatRupiah(this.totals.masuk)],
                            ['', '', '', 'Total Keluar', this.formatRupiah(this.totals.keluar)],
                        ],
                        columnStyles: { 0: { cellWidth: 25 }, 1: { cellWidth: 'auto' }, 2: { cellWidth: 25 }, 3: { cellWidth: 25 }, 4: { cellWidth: 45, halign: 'right' } },
                        styles: { fontSize: 8 }, 
                        footStyles: { fillColor: [240, 240, 240], textColor: [0, 0, 0], fontStyle: 'bold' }, 
                        theme: 'grid'
                    });
                    doc.save(`Laporan_RT13_${labelPeriode}.pdf`);
                },

                exportToExcel() {
                    const labelPeriode = this.getPeriodeLabel();
                    const rows = [
                        ["LAPORAN KEUANGAN KAS RT 13"],
                        ["Periode: " + labelPeriode],
                        [],
                        ['Tanggal', 'Keterangan', 'Kategori', 'Jenis', 'Jumlah']
                    ];

                    const sortedData = [...this.displayTransactions].sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

                    sortedData.forEach(i => {
                        rows.push([
                            new Date(i.tanggal).toLocaleDateString('id-ID'), 
                            i.deskripsi, 
                            i.kategori, 
                            i.jenis.toUpperCase(), 
                            Number(i.jumlah)
                        ]);
                    });

                    rows.push([]);
                    rows.push(['', '', '', 'TOTAL MASUK', this.totals.masuk]);
                    rows.push(['', '', '', 'TOTAL KELUAR', this.totals.keluar]);

                    const ws = XLSX.utils.aoa_to_sheet(rows);
                    ws['!cols'] = [ { wch: 15 }, { wch: 40 }, { wch: 20 }, { wch: 15 }, { wch: 20 } ];

                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Laporan");
                    XLSX.writeFile(wb, `Laporan_RT13_${labelPeriode}.xlsx`);
                },

                formatMonthYear(s) { const d=new Date(s); return `${this.monthNames[d.getMonth()]} ${d.getFullYear()}`; },
                formatRupiah(v) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(v || 0); }
            }
        }
    </script>
</body>
</html>
