<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tes Koneksi Google Sheets</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .status { padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        .loading { background: #fff3cd; color: #856404; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        pre { background: #f4f4f4; padding: 15px; border: 1px solid #ddd; overflow-x: auto; }
    </style>
</head>
<body>

    <h2>Tes Koneksi Database Sheets</h2>
    
    <div id="statusBox" class="status loading">Sedang menghubungkan ke Google Apps Script...</div>

    <h4>Data Mentah (JSON):</h4>
    <pre id="rawOutput">Menunggu data...</pre>

    <script>
        // GANTI URL INI DENGAN URL WEB APP ANDA
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyfC_m5CU6xnR_YgUCMJ9qmgnuJQFWQuAWTcMK68N63Vmnba56WHjSgwRJP7npt8jq-/exec';

        async function testConnection() {
            const statusBox = document.getElementById('statusBox');
            const rawOutput = document.getElementById('rawOutput');

            try {
                // Mencoba mengambil data
                const response = await fetch(WEB_APP_URL, {
                    method: 'GET',
                    redirect: 'follow'
                });

                if (!response.ok) throw new Error('Respon Server Tidak Oke (404/500)');

                const data = await response.json();

                // Jika berhasil sampai sini
                statusBox.className = 'status success';
                statusBox.innerHTML = '<b>Koneksi Berhasil!</b> Data berhasil ditarik.';
                rawOutput.textContent = JSON.stringify(data, null, 2);
                
                console.log('Data diterima:', data);

            } catch (error) {
                // Jika gagal
                statusBox.className = 'status error';
                statusBox.innerHTML = '<b>Koneksi Gagal!</b><br>Error: ' + error.message;
                rawOutput.textContent = 'Tidak ada data yang bisa ditampilkan.\n\nTips:\n1. Pastikan URL sudah benar.\n2. Pastikan Deploy sebagai "Anyone".\n3. Cek apakah ada data di Google Sheets Anda.';
                console.error('Detail Error:', error);
            }
        }

        // Jalankan tes
        testConnection();
    </script>
</body>
</html>
