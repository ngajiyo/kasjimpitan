<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kas RT 13</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        [x-cloak] { display: none !important; }
        .sticky-summary { position: sticky; top: 0.75rem; z-index: 40; }
        .img-thumbnail { width: 100%; max-height: 200px; object-fit: cover; border-radius: 1.5rem; cursor: pointer; }
        .card-interactive { transition: all 0.2s ease; cursor: pointer; user-select: none; }
        .card-interactive:active { transform: scale(0.95); filter: brightness(0.9); }
        .notification-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 200; }
        .fullscreen-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body x-data="dashboard()">

    <div x-show="showToast" class="notification-toast bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl text-xs font-black uppercase tracking-widest border border-white/20" x-cloak x-transition>
        🔓 Mode Ubah Diaktifkan
    </div>

    <div x-show="showFullscreen" class="fullscreen-overlay" x-cloak @click="showFullscreen = false" x-transition>
        <img :src="selectedItem.nota_url" class="max-w-full max-h-full rounded-lg shadow-2xl">
        <button class="absolute top-6 right-6 text-white bg-white/10 p-3 rounded-full backdrop-blur-md">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <div class="max-w-md md:max-w-4xl mx-auto p-4 pb-24">
        <header class="mb-5 flex justify-between items-end px-1">
            <div>
                <p class="text-[9px] text-slate-400 font-black uppercase tracking-[0.3em] mb-0.5">Laporan Keuangan RT 13</p>
                <h1 class="text-xl font-[900] text-slate-900 tracking-tight">DK. JASEM RT 13</h1>
            </div>
            <button @click="fetchData()" class="p-2.5 bg-white rounded-xl shadow-sm border border-slate-100 active:scale-90 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            </button>
        </header>

        <div class="sticky-summary space-y-2">
            <div :class="isAdmin ? 'bg-slate-900' : 'bg-blue-700'" class="rounded-[2rem] p-5 shadow-xl text-white relative border border-white/10 transition-colors duration-500">
                <div class="text-center card-interactive py-2" @click="handleSecretClick()">
                    <p class="text-[9px] opacity-70 uppercase font-black tracking-widest mb-1">Total Saldo Seluruhnya</p>
                    <h2 class="text-3xl font-[900] tracking-tight" x-text="formatRupiah(totals.saldo)"></h2>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div class="bg-white p-4 rounded-[2rem] border border-slate-100 shadow-sm flex flex-col justify-between">
                    <div>
                        <p class="text-[8px] text-slate-400 uppercase font-black tracking-wider mb-1">Tabungan</p>
                        <p class="text-sm font-[900] text-slate-900" x-text="formatRupiah(totals.saldoTabungan)"></p>
                    </div>
                    <div class="mt-3 pt-2 border-t border-slate-50 space-y-1.5">
                        <div class="flex items-center gap-1.5 text-emerald-600 font-[800] text-[11px]">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                            <span x-text="formatRupiah(totals.masukTabungan)"></span>
                        </div>
                        <div class="flex items-center gap-1.5 text-rose-600 font-[800] text-[11px]">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                            <span x-text="formatRupiah(totals.keluarTabungan)"></span>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-[2rem] border border-slate-100 shadow-sm flex flex-col justify-between">
                    <div>
                        <p class="text-[8px] text-slate-400 uppercase font-black tracking-wider mb-1">Jimpitan</p>
                        <p class="text-sm font-[900] text-slate-900" x-text="formatRupiah(totals.saldoJimpitan)"></p>
                    </div>
                    <div class="mt-3 pt-2 border-t border-slate-50 space-y-1.5">
                        <div class="flex items-center gap-1.5 text-emerald-600 font-[800] text-[11px]">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                            <span x-text="formatRupiah(totals.masukJimpitan)"></span>
                        </div>
                        <div class="flex items-center gap-1.5 text-rose-600 font-[800] text-[11px]">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                            <span x-text="formatRupiah(totals.keluarJimpitan)"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-6 space-y-3">
            <div class="flex gap-2">
                <select x-model="combinedFilter" @change="applyCombinedFilter()" class="py-3.5 px-4 rounded-2xl bg-white border border-slate-200 text-[11px] font-black text-slate-700 outline-none flex-1 shadow-sm appearance-none">
                    <option value="semua">Semua Riwayat</option>
                    <option value="bulan">Bulan Ini</option>
                    <optgroup label="Arsip Bulanan">
                        <template x-for="opt in archiveOptions" :key="opt.id">
                            <option :value="opt.id" x-text="opt.label"></option>
                        </template>
                    </optgroup>
                </select>
                <div class="flex gap-1.5">
                    <button @click="exportToPDF()" class="bg-rose-600 text-white p-3.5 rounded-2xl shadow-lg active:scale-90">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" /><path d="M9 15h6"/></svg>
                    </button>
                </div>
            </div>
            <input type="text" x-model="searchQuery" @input="applySearch()" placeholder="Cari deskripsi..." class="w-full bg-white border border-slate-200 py-3.5 px-5 rounded-2xl text-sm font-bold shadow-sm outline-none focus:ring-2 focus:ring-blue-500/20">
        </div>

        <div class="mt-6 space-y-8">
            <template x-for="group in groupedTransactions" :key="group.monthYear">
                <div class="space-y-3">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] px-2" x-text="group.monthYear"></h3>
                    <div class="space-y-3">
                        <template x-for="item in group.items" :key="item.id">
                            <div @click="openDetailModal(item)" class="bg-white p-4 rounded-3xl border border-slate-50 shadow-sm flex items-center gap-4 active:scale-[0.98] cursor-pointer">
                                <div class="w-12 h-12 bg-slate-50 rounded-2xl flex flex-col items-center justify-center border shrink-0">
                                    <span class="text-sm font-[800]" x-text="new Date(item.tanggal).getDate()"></span>
                                    <span class="text-[8px] uppercase font-black text-blue-600" x-text="monthNames[new Date(item.tanggal).getMonth()].substring(0,3)"></span>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h4 class="text-sm font-bold text-slate-800 truncate" x-text="item.deskripsi"></h4>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[8px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-black uppercase" x-text="item.rekening || 'jimpitan'"></span>
                                        <span class="text-[9px] text-slate-300 font-bold uppercase" x-text="item.kategori"></span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p :class="item.jenis === 'pemasukan' ? 'text-emerald-600' : 'text-rose-600'" class="text-sm font-[900]" x-text="(item.jenis === 'pemasukan' ? '+' : '-') + formatRupiah(item.jumlah).replace('Rp', '')"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <div x-show="showDetailModal" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" x-cloak x-transition>
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] shadow-2xl p-6 text-center" @click.away="showDetailModal = false">
            <template x-if="selectedItem.nota_url">
                <img :src="selectedItem.nota_url" @click="showFullscreen = true" class="img-thumbnail mb-4 border border-slate-100 shadow-sm hover:brightness-90 transition-all">
            </template>
            <h3 class="text-3xl font-[900] text-slate-900 mb-1" x-text="formatRupiah(selectedItem.jumlah)"></h3>
            <p class="text-sm text-slate-600 font-bold mb-4" x-text="selectedItem.deskripsi"></p>
            <div class="flex gap-2">
                <button @click="showDetailModal = false" class="flex-1 py-4 text-xs font-black text-slate-400 bg-slate-50 rounded-2xl uppercase">Tutup</button>
                <button x-show="isAdmin" @click="openEditFromDetail()" class="flex-1 py-4 text-xs font-black text-blue-600 bg-blue-50 rounded-2xl uppercase">Ubah</button>
            </div>
            <button x-show="isAdmin" @click="deleteData(selectedItem.id)" class="w-full mt-2 py-3 text-[9px] font-black text-rose-500 uppercase tracking-widest">Hapus Transaksi</button>
        </div>
    </div>

    <div x-show="showEditModal" class="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" x-cloak x-transition>
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl overflow-y-auto max-h-[90vh]" @click.away="showEditModal = false">
            <h3 class="text-xl font-black text-center mb-6 text-slate-800 uppercase">Ubah Data</h3>
            
            <div class="space-y-4 text-left">
                <div x-show="editingData.nota_url" class="relative mb-4">
                    <label class="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 block">Lampiran Saat Ini</label>
                    <img :src="editingData.nota_url" class="w-full h-32 object-cover rounded-2xl border border-slate-100">
                    <button @click="editingData.nota_url = null" class="absolute top-7 right-2 bg-rose-600 text-white p-1.5 rounded-full shadow-lg">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <div>
                    <label class="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 block">Ganti Lampiran Foto</label>
                    <input type="file" @change="uploadImage($event)" class="w-full text-[10px] bg-slate-50 p-3 rounded-xl border border-dashed border-slate-200" accept="image/*">
                </div>
                <div>
                    <label class="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 block">Tanggal Transaksi</label>
                    <input type="date" x-model="editingData.tanggal" class="w-full p-3.5 bg-slate-50 rounded-2xl border-none font-bold outline-none ring-1 ring-slate-100">
                </div>
                <div>
                    <label class="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 block">Rekening</label>
                    <select x-model="editingData.rekening" class="w-full p-3.5 bg-slate-50 rounded-2xl border-none font-bold outline-none ring-1 ring-slate-100">
                        <option value="jimpitan">jimpitan</option>
                        <option value="tabungan">tabungan</option>
                    </select>
                </div>
                <div>
                    <label class="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 block">Deskripsi</label>
                    <input type="text" x-model="editingData.deskripsi" class="w-full p-3.5 bg-slate-50 rounded-2xl font-bold outline-none ring-1 ring-slate-100 border-none">
                </div>
                <div>
                    <label class="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1 block">Jumlah (Rp)</label>
                    <input type="number" x-model="editingData.jumlah" class="w-full p-3.5 bg-slate-50 rounded-2xl font-black text-blue-600 outline-none ring-1 ring-slate-100 border-none text-xl">
                </div>
            </div>

            <div class="flex gap-3 mt-8">
                <button @click="showEditModal = false" class="flex-1 py-4 font-black text-xs text-slate-400 uppercase">Batal</button>
                <button @click="updateData()" :disabled="isUploading" class="flex-1 py-4 bg-slate-900 text-white rounded-2xl font-black text-xs uppercase shadow-lg disabled:opacity-50" x-text="isUploading ? 'Uploading...' : 'Simpan'"></button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pfichwnfffjzibusofao.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmaWNod25mZmZqemlidXNvZmFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MzE0NjIsImV4cCI6MjA4MTQwNzQ2Mn0.Hp9nGeQEiNXnKoPkeSY2Qoey0HP2Er0E4TbwBe_y64c';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function dashboard() {
            return {
                allData: [], 
                filteredTransactions: [], 
                groupedTransactions: [], 
                searchQuery: '', 
                archiveOptions: [], 
                combinedFilter: 'semua', 
                totals: { saldo: 0, saldoTabungan: 0, masukTabungan: 0, keluarTabungan: 0, saldoJimpitan: 0, masukJimpitan: 0, keluarJimpitan: 0 }, 
                showDetailModal: false, 
                showEditModal: false, 
                showFullscreen: false,
                isUploading: false, 
                selectedItem: {}, 
                editingData: {},
                isAdmin: false, 
                clickCount: 0, 
                showToast: false,
                monthNames: ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"],

                async init() { await this.fetchData(); },
                
                handleSecretClick() {
                    this.clickCount++;
                    if (this.clickCount >= 4) {
                        this.isAdmin = !this.isAdmin;
                        this.clickCount = 0;
                        if (this.isAdmin) { this.showToast = true; setTimeout(() => this.showToast = false, 3000); }
                    }
                },

                async fetchData() {
                    const { data } = await _supabase.from('kas_rt').select('*').order('tanggal', { ascending: false });
                    this.allData = data || [];
                    this.generateArchiveOptions();
                    this.applyCombinedFilter(); 
                },

                generateArchiveOptions() {
                    const groups = new Set();
                    this.allData.forEach(i => { 
                        const d = new Date(i.tanggal); 
                        groups.add(`${d.getMonth()}-${d.getFullYear()}`); 
                    });
                    this.archiveOptions = Array.from(groups).map(g => {
                        const [m, y] = g.split('-');
                        return { id: g, label: `${this.monthNames[m]} ${y}`, month: m, year: y };
                    }).sort((a,b) => b.year - a.year || b.month - a.month);
                },

                applyCombinedFilter() {
                    if (this.combinedFilter === 'semua') {
                        this.filteredTransactions = [...this.allData];
                    } else if (this.combinedFilter === 'bulan') {
                        const now = new Date();
                        this.filteredTransactions = this.allData.filter(i => { 
                            const d = new Date(i.tanggal); 
                            return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); 
                        });
                    } else {
                        const [m, y] = this.combinedFilter.split('-');
                        this.filteredTransactions = this.allData.filter(i => { 
                            const d = new Date(i.tanggal); 
                            return d.getMonth() == m && d.getFullYear() == y; 
                        });
                    }
                    this.calculate(); 
                    this.applySearch();
                },

                applySearch() {
                    const q = this.searchQuery.toLowerCase();
                    const searched = this.filteredTransactions.filter(i => i.deskripsi.toLowerCase().includes(q));
                    this.groupTransactions(searched);
                },

                groupTransactions(data) {
                    const groups = {};
                    data.forEach(item => {
                        const date = new Date(item.tanggal);
                        const key = `${this.monthNames[date.getMonth()]} ${date.getFullYear()}`;
                        if (!groups[key]) groups[key] = [];
                        groups[key].push(item);
                    });
                    this.groupedTransactions = Object.keys(groups).map(key => ({
                        monthYear: key,
                        items: groups[key]
                    }));
                },

                calculate() {
                    let t = { saldo: 0, saldoTabungan: 0, masukTabungan: 0, keluarTabungan: 0, saldoJimpitan: 0, masukJimpitan: 0, keluarJimpitan: 0 };
                    this.allData.forEach(item => {
                        const jml = Number(item.jumlah);
                        const isMasuk = item.jenis === 'pemasukan';
                        const rek = (item.rekening || '').toLowerCase().trim();
                        if (rek === 'tabungan') {
                            if (isMasuk) t.masukTabungan += jml; else t.keluarTabungan += jml;
                        } else {
                            if (isMasuk) t.masukJimpitan += jml; else t.keluarJimpitan += jml;
                        }
                    });
                    t.saldoTabungan = t.masukTabungan - t.keluarTabungan;
                    t.saldoJimpitan = t.masukJimpitan - t.keluarJimpitan;
                    t.saldo = t.saldoTabungan + t.saldoJimpitan;
                    this.totals = t;
                },

                openDetailModal(item) { this.selectedItem = item; this.showDetailModal = true; },
                openEditFromDetail() { this.editingData = { ...this.selectedItem }; this.showDetailModal = false; setTimeout(() => this.showEditModal = true, 300); },

                async uploadImage(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    this.isUploading = true;
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}.${fileExt}`;
                    const filePath = `nota/${fileName}`;
                    const { error: uploadError } = await _supabase.storage.from('upload').upload(filePath, file);
                    if (uploadError) { alert('Gagal upload gambar'); this.isUploading = false; return; }
                    const { data: { publicUrl } } = _supabase.storage.from('upload').getPublicUrl(filePath);
                    this.editingData.nota_url = publicUrl;
                    this.isUploading = false;
                },

                async updateData() {
                    const { error } = await _supabase.from('kas_rt').update({ 
                        tanggal: this.editingData.tanggal,
                        deskripsi: this.editingData.deskripsi, 
                        jumlah: this.editingData.jumlah, 
                        rekening: this.editingData.rekening,
                        nota_url: this.editingData.nota_url 
                    }).eq('id', this.editingData.id);
                    if (!error) { this.showEditModal = false; await this.fetchData(); }
                },

                async deleteData(id) {
                    if (confirm('Hapus transaksi ini?')) {
                        const { error } = await _supabase.from('kas_rt').delete().eq('id', id);
                        if (!error) { this.showDetailModal = false; await this.fetchData(); }
                    }
                },

                formatRupiah(v) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(v || 0); },

                // Format tanggal khusus untuk tabel PDF: dd-MMM-yy (contoh: 23-Agu-26)
                formatTanggalPDF(tgl) {
                    const d = new Date(tgl);
                    const dd = String(d.getDate()).padStart(2, '0');
                    const mmm = this.monthNames[d.getMonth()].substring(0, 3);
                    const yy = String(d.getFullYear()).slice(-2);
                    return `${dd}-${mmm}-${yy}`;
                },

                getPeriodeLabel() {
                    if (this.combinedFilter === 'semua') return 'Semua Riwayat';
                    if (this.combinedFilter === 'bulan') return this.monthNames[new Date().getMonth()] + ' ' + new Date().getFullYear();
                    const [m, y] = this.combinedFilter.split('-');
                    return `${this.monthNames[m]} ${y}`;
                },

                exportToPDF() {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    const labelPeriode = this.getPeriodeLabel();
                    
                    doc.setFontSize(16);
                    doc.setFont('helvetica', 'bold');
                    doc.text("LAPORAN KEUANGAN KAS RT 13", 14, 15);
                    doc.setFontSize(10);
                    doc.text("Periode: " + labelPeriode, 14, 22);

                    // Sorting data berdasarkan tanggal (Ascending: Kecil ke Besar)
                    const sortedData = [...this.filteredTransactions].sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

                    // --- REKENING JIMPITAN ---
                    const dataJimpitan = sortedData.filter(i => (i.rekening || '').toLowerCase().trim() !== 'tabungan');
                    let mJ = 0, kJ = 0;
                    const rowsJimpitan = dataJimpitan.map(i => {
                        const jml = Number(i.jumlah);
                        const labelJenis = i.jenis === 'pemasukan' ? 'Pemasukan' : 'Pengeluaran';
                        if (i.jenis === 'pemasukan') mJ += jml; else kJ += jml;
                        return [this.formatTanggalPDF(i.tanggal), i.deskripsi, labelJenis, this.formatRupiah(jml)];
                    });

                    doc.setFontSize(11);
                    doc.text("REKENING JIMPITAN", 14, 32);
                    doc.autoTable({
                        head: [['Tanggal', 'Keterangan', 'Jenis', 'Jumlah']],
                        body: rowsJimpitan,
                        startY: 35,
                        theme: 'grid',
                        styles: { fontSize: 8 },
                        columnStyles: { 3: { halign: 'right' } },
                        headStyles: { fillColor: [51, 65, 85] },
                        foot: [
                            ['', '', 'TOTAL MASUK', this.formatRupiah(mJ)],
                            ['', '', 'TOTAL KELUAR', this.formatRupiah(kJ)]
                        ],
                        footStyles: { fillColor: [241, 245, 249], textColor: [0,0,0], fontStyle: 'bold', halign: 'right' }
                    });

                    // --- REKENING TABUNGAN ---
                    const dataTabungan = sortedData.filter(i => (i.rekening || '').toLowerCase().trim() === 'tabungan');
                    let mT = 0, kT = 0;
                    const rowsTabungan = dataTabungan.map(i => {
                        const jml = Number(i.jumlah);
                        const labelJenis = i.jenis === 'pemasukan' ? 'Pemasukan' : 'Pengeluaran';
                        if (i.jenis === 'pemasukan') mT += jml; else kT += jml;
                        return [this.formatTanggalPDF(i.tanggal), i.deskripsi, labelJenis, this.formatRupiah(jml)];
                    });

                    let finalY = doc.lastAutoTable.finalY || 35;
                    doc.setFontSize(11);
                    doc.text("REKENING TABUNGAN", 14, finalY + 15);
                    doc.autoTable({
                        head: [['Tanggal', 'Keterangan', 'Jenis', 'Jumlah']],
                        body: rowsTabungan,
                        startY: finalY + 18,
                        theme: 'grid',
                        styles: { fontSize: 8 },
                        columnStyles: { 3: { halign: 'right' } },
                        headStyles: { fillColor: [29, 78, 216] },
                        foot: [
                            ['', '', 'TOTAL MASUK', this.formatRupiah(mT)],
                            ['', '', 'TOTAL KELUAR', this.formatRupiah(kT)]
                        ],
                        footStyles: { fillColor: [241, 245, 249], textColor: [0,0,0], fontStyle: 'bold', halign: 'right' }
                    });

                    // --- TABEL RINGKASAN SALDO (Hanya jika "Semua Riwayat") ---
                    if (this.combinedFilter === 'semua') {
                        let finalY2 = doc.lastAutoTable.finalY || finalY + 18;
                        doc.setFontSize(11);
                        doc.text("RINGKASAN SALDO AKHIR", 14, finalY2 + 15);
                        doc.autoTable({
                            head: [['Nama Rekening', 'Saldo Akhir']],
                            body: [
                                ['Saldo Jimpitan', this.formatRupiah(this.totals.saldoJimpitan)],
                                ['Saldo Tabungan', this.formatRupiah(this.totals.saldoTabungan)],
                                ['TOTAL KAS KESELURUHAN', this.formatRupiah(this.totals.saldo)]
                            ],
                            startY: finalY2 + 18,
                            theme: 'grid',
                            styles: { fontSize: 10, fontStyle: 'bold' },
                            columnStyles: { 1: { halign: 'right' } },
                            headStyles: { fillColor: [15, 23, 42] }
                        });
                    }

                    doc.save(`Laporan_RT13_${labelPeriode.replace(/ /g, '_')}.pdf`);
                }
            }
        }
    </script>
</body>
</html>
